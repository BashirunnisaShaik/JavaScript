<!DOCTYPE html>
<html>
<head>
    <title>Factors of a Number</title>
    <style>

        .container {
            width: 100%;
            height: 100vh;
            background: rgb(150, 247, 249);
            padding: 30px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            height: 20px;
            font-size: 18px;
            padding: 5px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Factors of a Number</h2>
         <label for="num">Enter number:</label>
        <input type="number" id="num" placeholder="Enter a number">

        <br>

        <button onclick="findFactors()">Find Factors</button>

        <p id="result"></p>
    </div>

    <script>
        function findFactors() {
            let num = document.getElementById("num").value;

            if (num === "") {
                document.getElementById("result").innerHTML =
                "Please enter a number!";
                return;
            }

            let factors = "";

            for (let i = 1; i <= num; i++) {
                if (num % i === 0) {
                    factors += i + " ";
                }
            }

            document.getElementById("result").innerHTML =
            "Factors of " + num + " are: " + factors;
        }
    </script>

</body>
</html>
