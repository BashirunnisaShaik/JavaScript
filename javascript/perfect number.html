<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfect Number Checker</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }
     .container{
        width:100%px;
        height: 100vh;
        background:white;
        padding:30px;
        border-radius:10px;
        text-align:center;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h2{
        margin-bottom:20px;
    }

    input{
        width:40%;
        height:45px;
        font-size:18px;
        padding:10px;
        margin-bottom:15px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    button{
        width:100%;
        height:45px;
        font-size:18px;
        border:none;
        border-radius:5px;
        cursor:pointer;
    }

    button:hover{
        background-color:lightblue;
    }

    #result{
        margin-top:20px;
        font-size:20px;
        font-weight:bold;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Perfect Number Checker</h2>

    <input type="number" id="num" placeholder="Enter a Number">

    <button onclick="checkPerfect()">Check</button>

    <p id="result"></p>
</div>

<script>
function checkPerfect() {

    let num = document.getElementById("num").value;

    if(num === ""){
        document.getElementById("result").innerHTML =
        "Please enter a number!";
        return;
    }

    num = Number(num);

    let sum = 0;

    for(let i = 1; i < num; i++){
        if(num % i === 0){
            sum += i;
        }
    }

    if(sum === num){
        document.getElementById("result").innerHTML =
        num + " is a Perfect Number";
    }
    else{
        document.getElementById("result").innerHTML =
        num + " is Not a Perfect Number";
    }
}
</script>

</body>
</html>
