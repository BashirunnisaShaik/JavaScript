<!DOCTYPE html>
<html>
<head>
    <title>Temperature Check</title>
</head>
<body>
<h2 id="result"></h2>
<script>
    let temp = 45;
    if (temp > 40) {
        document.getElementById("result").innerHTML = "Temperature is greater than 40";
    }
    else {
        document.getElementById("result").innerHTML = "Temperature is normal";
    }
</script>
</body>
</html>
