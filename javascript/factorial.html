<!DOCTYPE html>
<html>
<head>
    <title>Factorial Calculator</title>

    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container{
            width: 100%;
            height: 100vh;
            text-align: center;
            border: 1px solid black;
            padding: 40px;
            
        }

        input{
            width: 400px;
            height: 40px;
            font-size: 18px;
            margin: 10px;
        }

        button{
            padding: 10px 20px;
            font-size: 18px;
            width: 300px;
        }

        #result{
            font-size: 20px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Factorial of a Number</h2>

        <input type="number" id="num" placeholder="Enter a number">
        <br>

        <button onclick="findFactorial()">Find Factorial</button>

        <p id="result"></p>
    </div>

    <script>
        function findFactorial() {
            let num = document.getElementById("num").value;

            if (num === "") {
                document.getElementById("result").innerHTML =
                "Please enter a number!";
                return;
            }

            let fact = 1;

            for(let i = 1; i <= num; i++) {
                fact *= i;
            }

            document.getElementById("result").innerHTML =
            "Factorial of " + num + " is " + fact;
        }
    </script>

</body>
</html>
